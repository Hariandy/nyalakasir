/* ---------- Exact decimal helpers ---------- */
function toScaled(value){
 const s=String(value??"").trim().replace(",",".");
 if(!s) return null;
 if(!/^[+-]?(?:\d+\.?\d*|\.\d+)$/.test(s)) return null;
 const sign=s.startsWith("-")?-1n:1n;
 const clean=s.replace(/^[+-]/,"");
 const [a,b=""] = clean.split(".");
 if(b.length>6) return null;
 const whole=BigInt(a||"0");
 const frac=BigInt((b+"000000").slice(0,6));
 return sign*(whole*Q_SCALE+frac);
}
function scaledToNumber(v){return Number(v)/1e6;}
function moneyRoundFromRational(numerator, denominator){
 if(denominator===0n) return 0;
 const neg=numerator<0n; const a=neg?-numerator:numerator;
 const q=a/denominator, r=a%denominator;
 const rounded=q+(r*2n>=denominator?1n:0n);
 return Number(neg?-rounded:rounded);
}
function ingredientUnitCost(ing){
 const price=BigInt(Math.trunc(Number(ing.price)||0));
 /* V13 BUG-02: cost basis uses purchase size (buyQty), never the depleting stock (qty). */
 const qty=toScaled(ing.buyQty??ing.qty);
 if(qty===null || qty<=0n) return {num:price,den:1n};
 return {num:price,den:qty};
}
function lineCostRational(ing, recipeQty){
 const rq=toScaled(recipeQty);
 if(rq===null || rq<0n) return {num:0n,den:1n};
 const {num,den}=ingredientUnitCost(ing);
 return {num:num*rq,den};
}
function addRational(a,b){
 if(a.den===b.den) return {num:a.num+b.num,den:a.den};
 return {num:a.num*b.den+b.num*a.den,den:a.den*b.den};
}
function calculateRecipeHppRaw(recipe, ingredients){
 let total={num:0n,den:1n};
 for(const r of (recipe||[])){
   const ing=ingredients.find(i=>i.id===r.ingredientId);
   if(!ing) continue;
   total=addRational(total,lineCostRational(ing,r.qty));
 }
 return total;
}
function calculateRecipeHpp(recipe, ingredients){
 const r=calculateRecipeHppRaw(recipe,ingredients);
 return moneyRoundFromRational(r.num,r.den);
}
function productHppRaw(product,ingredients){
 if(state.type==="retail" && product?.stockItemId){
   const ing=ingredients.find(i=>i.id===Number(product.stockItemId));
   const usage=toScaled(product.stockUsageQty);
   const packSize=toScaled(ing?.packSize);
   if(ing&&usage!==null&&usage>0n&&packSize!==null&&packSize>0n){
     const packagePrice=BigInt(Math.trunc(Number(ing.price)||0));
     return {num:packagePrice*usage,den:Q_SCALE};
   }
 }
 if(product && Array.isArray(product.recipe) && product.recipe.length) return calculateRecipeHppRaw(product.recipe,ingredients);
 return {num:BigInt(Math.max(0,Math.trunc(Number(product?.manualHpp)||0))),den:1n};
}
function calculateCartTotals(cart,products,ingredients){
 let total=0,count=0,hppRaw={num:0n,den:1n};
 for(const line of cart){
  const p=products.find(x=>x.id===line.productId);if(!p)continue;
  const qs=toScaled(line.qty);if(qs===null||qs<=0n)continue;
  const qty=Number(line.qty)||0;
  total+=moneyRoundFromRational(BigInt(Math.trunc(Number(p.price)||0))*qs,Q_SCALE);
  const pr=productHppRaw(p,ingredients);
  hppRaw=addRational(hppRaw,{num:pr.num*qs,den:pr.den*Q_SCALE});
  count+=qty;
 }
 const hpp=moneyRoundFromRational(hppRaw.num,hppRaw.den);
 return{total,hpp,profit:total-hpp,count};
}
function getProductHpp(product,ingredients){
 const r=productHppRaw(product,ingredients);
 return moneyRoundFromRational(r.num,r.den);
}
function formatIDR(n){return "Rp "+Math.round(Number(n)||0).toLocaleString("id-ID");}
function formatQty(n){
 const x=Number(n)||0;
 return Number.isInteger(x)?String(x):String(x).replace(".",",");
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function slugId(){return Date.now()+"-"+Math.random().toString(36).slice(2,8);}
function nextId(items){let max=0;for(const item of items){const n=Number(item.id);if(Number.isFinite(n)&&n>max)max=n;}return max+1;}
function makeTxId(){
 const d=new Date(), pad=n=>String(n).padStart(2,"0");
 const base=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
 const c=globalThis.crypto;const rnd=(c?.randomUUID?c.randomUUID():Math.random().toString(36).slice(2)).slice(0,8).toUpperCase();
 return `TRX-${base}-${rnd}`;
}
function isTodayLocal(iso){
 const d=new Date(iso), now=new Date();
 return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate();
}
function csvCell(v){return `"${String(v??"").replace(/"/g,'""')}"`;}
function getQuickCashSuggestions(total){
 if(!Number.isFinite(total)||total<=0)return[];
 const s=new Set([total]);
 [10000,20000,50000,100000].forEach(v=>{if(v>=total)s.add(v);});
 s.add(Math.ceil(total/10000)*10000);
 s.add(Math.ceil(total/50000)*50000);
 return [...s].filter(v=>v>=total).sort((a,b)=>a-b).slice(0,6);
}

function toast(message,error=false){
 /* V13 BUG-08: toast is drawn in its own layer; it never re-renders forms (no input loss). */
 state.toast={message,error};
 drawToast();
 clearTimeout(window.__ttmToastTimer);
 window.__ttmToastTimer=setTimeout(()=>{state.toast=null;drawToast();},2200);
}
function drawToast(){
 const phone=document.querySelector("#app .phone")||document.getElementById("app");if(!phone)return;
 let el=document.getElementById("toast-layer");
 if(!state.toast){if(el)el.remove();return;}
 if(!el){el=document.createElement("div");el.id="toast-layer";el.setAttribute("role","status");phone.appendChild(el);}
 el.className="toast "+(state.toast.error?"error":"");el.textContent=(state.toast.error?"⚠ ":"✓ ")+state.toast.message;
}

function renderIngredients(){

  const costText=state.type==="retail"&&packSize
    ?`Modal per ${esc(i.contentUnit||"unit")}: ${formatIDR(retailPerUnit)}`
    :`Biaya dasar: ${formatIDR(unitCost)} / ${esc(i.unit)}`;

/* ---------- Actions ---------- */
function login(){
 const e=document.getElementById("login-email"),p=document.getElementById("login-pass"),err=document.getElementById("login-error");
 if(!e||!p)return;
 if(!e.value.trim()||!p.value){
  if(err){err.textContent="Email / username dan kata sandi wajib diisi.";err.style.display="block";}
  return;
 }
 state.logged=true;state.tab="pos";persist();render();
}
function logout(){
 state.logged=false;state.cart=[];state.modal=null;state.toast=null;
 persist();render();
}
function nav(tab){state.tab=tab;state.search="";state.modal=null;persist();render();}
function setCategory(c){state.cat=c;render();}
function addCart(id){
 const p=state.products.find(x=>x.id===Number(id)); if(!p)return;
 const line=state.cart.find(x=>x.productId===p.id);
 if(line)line.qty+=1;else state.cart.push({productId:p.id,qty:1});
 persist();render();
}
function mutateCart(id,delta){
 const line=state.cart.find(x=>x.productId===Number(id)); if(!line)return;
 line.qty=Math.max(0,line.qty+delta);
 if(line.qty===0)state.cart=state.cart.filter(x=>x!==line);
 persist();render();
}
function removeCart(id){state.cart=state.cart.filter(x=>x.productId!==Number(id));persist();render();}
function openCart(){if(state.cart.length)state.modal={type:"cart"};render();}
function openPayment(){if(!state.cart.length){toast("Keranjang masih kosong",true);return;}state.modal={type:"payment",method:"Tunai",cash:cartTotal()};render();}
function setPayMethod(v){if(state.modal?.type!=="payment")return;state.modal.method=v;if(v==="Tunai")state.modal.cash=cartTotal();render();}
function setCash(v){if(state.modal?.type!=="payment")return;state.modal.cash=Math.max(0,Number(v)||0);render();}
function setQuickCash(v){if(state.modal?.type!=="payment")return;state.modal.cash=Math.max(0,Math.trunc(Number(v)||0));render();}
function updatePaymentLive(){
 if(state.modal?.type!=="payment")return;
 const total=cartTotal(),cash=Number(state.modal.cash||0),enough=(state.modal.method||"Tunai")!=="Tunai"||cash>=total;
 const ch=document.getElementById("pay-change");
 if(ch){ch.className="payment-ref-change "+(enough?"good":"bad");ch.innerHTML=`<span>${enough?"Kembalian":"Uang Kurang"}</span><strong>${enough?formatIDR(cash-total):formatIDR(Math.max(0,total-cash))}</strong>`;}
 const btn=document.querySelector("[data-action=checkout]");if(btn)btn.disabled=!enough;
 document.querySelectorAll("[data-action=quick-cash]").forEach(b=>b.classList.toggle("active",Number(b.dataset.value)===cash));
}
function checkout(){
 if(state.modal?.type!=="payment"||!state.cart.length)return;
 const totals=calculateCartTotals(state.cart,state.products,state.ingredients);
 const method=state.modal.method||"Tunai";const cash=method==="Tunai"?Math.trunc(Number(state.modal.cash||0)):totals.total;
 if(!Number.isFinite(cash)||cash<totals.total){toast("Uang diterima belum cukup.",true);return;}
 const required={};
 for(const line of state.cart){
  const p=state.products.find(x=>x.id===line.productId);const cartQty=toScaled(line.qty);
  if(!p){toast("Ada produk di keranjang yang sudah tidak tersedia.",true);return;}
  if(cartQty===null||cartQty<=0n){toast(`Quantity ${p.name} tidak valid.`,true);return;}
  if(state.type==="retail"){
   const stockId=Number(p.stockItemId);const usage=toScaled(p.stockUsageQty);
   if(!stockId||usage===null||usage<=0n){toast(`Stok grosir untuk ${p.name} belum dikonfigurasi.`,true);return;}
   const ing=state.ingredients.find(x=>x.id===stockId);if(!ing){toast(`Stok grosir untuk ${p.name} tidak tersedia.`,true);return;}
   const need=(usage*cartQty)/Q_SCALE;required[stockId]=(required[stockId]||0n)+need;
  }else{
   for(const r of (p.recipe||[])){
    const rq=toScaled(r.qty);if(rq===null||rq<=0n){toast(`Resep ${p.name} memiliki quantity yang tidak valid.`,true);return;}
    const ing=state.ingredients.find(x=>x.id===Number(r.ingredientId));if(!ing){toast(`Bahan resep untuk ${p.name} tidak tersedia.`,true);return;}
    const need=(rq*cartQty)/Q_SCALE;required[r.ingredientId]=(required[r.ingredientId]||0n)+need;
   }
  }
 }
 for(const [id,need] of Object.entries(required)){
  const ing=state.ingredients.find(x=>x.id===Number(id));const avail=ing?toScaled(ing.qty):null;
  if(!ing||avail===null||avail<need){toast(ing?`Stok ${ing.name} tidak cukup. Tersedia ${formatQty(scaledToNumber(avail||0n))} ${ing.unit}, perlu ${formatQty(scaledToNumber(need))} ${ing.unit}.`:"Ada bahan resep yang tidak tersedia.",true);return;}
 }
 const items=[];
 for(const line of state.cart){const p=state.products.find(x=>x.id===line.productId);const h=getProductHpp(p,state.ingredients);items.push({id:p.id,name:p.name,qty:line.qty,price:Math.trunc(Number(p.price)||0),hpp:h});}
 const tx={id:makeTxId(),date:new Date().toISOString(),store:state.store,method,total:totals.total,totalHpp:totals.hpp,netProfit:totals.profit,cashReceived:cash,change:Math.max(0,cash-totals.total),items};
 for(const [id,need] of Object.entries(required)){const ing=state.ingredients.find(x=>x.id===Number(id));if(ing)ing.qty=Number(scaledToNumber((toScaled(ing.qty)||0n)-need).toFixed(6));}
 state.transactions.unshift(tx);state.cart=[];state.modal={type:"receipt",id:tx.id};persist();render();
}

 return {stockLabel:"Bahan Baku (HPP)",stockShort:"Bahan Baku",stockSubtitle:"Kelola bahan baku dan hitung HPP otomatis dari resep.",hppMode:"HPP",hppHelp:"HPP dihitung dari harga pembelian bahan dan pemakaian resep."};

function readRecipeFromModal(){

  const ingId=Number(row.querySelector(".recipe-ing")?.value);const qty=Number(row.querySelector(".recipe-qty")?.value);
  if(ingId&&Number.isFinite(qty)&&qty>0)recipe.push({ingredientId:ingId,qty});

function saveProduct(){
 const name=document.getElementById("product-name")?.value.trim();
 const price=Number(document.getElementById("product-price")?.value||0);
 const useRecipe=!!document.getElementById("use-recipe")?.checked;
 const draft=selectedProductDraft();
 const recipe=useRecipe?readRecipeFromModal():[];
 const manualHpp=Number(document.getElementById("product-hpp")?.value||0);
 if(!name||!Number.isFinite(price)||price<=0){toast("Nama dan harga jual wajib diisi dengan benar.",true);return;}
 if(useRecipe&&recipe.length===0){toast("Tambahkan minimal satu bahan untuk HPP otomatis.",true);return;}
 if(!useRecipe&&(!Number.isFinite(manualHpp)||manualHpp<0)){toast("HPP manual tidak boleh negatif.",true);return;}
 for(const r of recipe){const ing=state.ingredients.find(i=>i.id===Number(r.ingredientId));if(!ing||!Number.isFinite(Number(r.qty))||Number(r.qty)<=0){toast("Resep mengandung bahan atau quantity yang tidak valid.",true);return;}}
 const retailStockId=state.type==="retail"?Number(document.getElementById("stock-item")?.value||draft.stockItemId||0):null;
 const retailUsage=state.type==="retail"?Number(document.getElementById("stock-usage")?.value||draft.stockUsageQty||0):null;
 if(state.type==="retail" && (!retailStockId||!Number.isFinite(retailUsage)||retailUsage<=0)){toast("Sumber stok dan pemakaian stok wajib diisi untuk bisnis retail.",true);return;}
 const clean={id:draft.id||nextId(state.products),name,price:Math.round(price),manualHpp:state.type==="retail"?getProductHpp({...draft,stockItemId:retailStockId,stockUsageQty:retailUsage},state.ingredients):useRecipe?0:Math.round(manualHpp),stockItemId:state.type==="retail"?retailStockId:undefined,stockUsageQty:state.type==="retail"?retailUsage:undefined,category:draft.category||state.cats[1]||"Umum",image:draft.image||"",recipe:state.type==="retail"?[]:recipe};
 if(draft.id){const idx=state.products.findIndex(x=>x.id===draft.id);if(idx>=0)state.products[idx]=clean;}else state.products.unshift(clean);
 persist();state.modal=null;render();toast("Produk disimpan");
}
function saveIngredient(){
 const name=document.getElementById("ing-name")?.value.trim();const price=Number(document.getElementById("ing-price")?.value||0);const qty=Number(document.getElementById("ing-qty")?.value||0);const buyQty=Number(document.getElementById("ing-buy")?.value||0);const unit=document.getElementById("ing-unit")?.value||"gram";
 if(!name||!Number.isFinite(price)||price<0||!Number.isFinite(qty)||qty<0||!Number.isFinite(buyQty)||buyQty<=0){toast("Nama, harga pembelian, dan quantity harus valid. Harga tidak boleh negatif.",true);return;}
 const id=state.modal.id?Number(state.modal.id):nextId(state.ingredients);
 const packSize=state.type==="retail"?Number(document.getElementById("ing-pack-size")?.value||0):undefined;
 const contentUnit=state.type==="retail"?String(document.getElementById("ing-content-unit")?.value||"pcs"):undefined;
 if(state.type==="retail"&&(!Number.isFinite(packSize)||packSize<=0)){toast("Isi per kemasan harus lebih besar dari 0.",true);return;}
 const data={id,name,price:Math.round(price),qty,buyQty,unit,...(state.type==="retail"?{packSize,contentUnit}:{})};
 if(state.modal.id){const idx=state.ingredients.findIndex(x=>x.id===id);if(idx>=0)state.ingredients[idx]=data;}else state.ingredients.unshift(data);
 persist();state.modal=null;render();toast(`${terminology().stockShort} disimpan`);
}
async function handlePhoto(){
 const input=document.getElementById("product-photo-input");if(input)input.click();
}
async function processPhoto(file){
 if(!file)return;if(file.size>MAX_IMAGE_BYTES){toast("Ukuran foto maksimal 2 MB.",true);return;}if(!/^image\/(jpeg|png|webp)$/.test(file.type)){toast("Format foto harus JPG, PNG, atau WEBP.",true);return;}
 try{
  const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
  const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url;});
  let w=img.width,h=img.height,max=480;if(w>max){h=Math.round(h*max/w);w=max;}if(h>max){w=Math.round(w*max/h);h=max;}
  let q=.82,result="";for(let i=0;i<7;i++){const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);result=c.toDataURL("image/jpeg",q);if(Math.ceil(result.length*3/4)<=IMAGE_TARGET_BYTES)break;q-=.08;if(q<.4){w=Math.round(w*.82);h=Math.round(h*.82);q=.72;}}
  const d=selectedProductDraft();state.modal={...state.modal,__draftImage:result,__recipeDraft:d.recipe.map(r=>({...r})),__category:d.category,__name:d.name,__price:d.price,__manualHpp:d.manualHpp,__useRecipe:state.modal?.__useRecipe};render();
 }catch(e){toast("Foto tidak dapat diproses.",true);}
}
function productCategory(v){if(state.modal?.type!=="product")return;state.modal.__category=v;render();}
function addRecipeLine(){const d=selectedProductDraft();d.recipe.push({ingredientId:state.ingredients[0]?.id||0,qty:1});state.modal={...state.modal,__recipeDraft:d.recipe,__draftImage:d.image,__category:d.category,__name:d.name,__price:d.price,__manualHpp:d.manualHpp,__useRecipe:true};render();}
function removeRecipe(i){const rows=readRecipeFromModal();rows.splice(Number(i),1);const d=selectedProductDraft();state.modal={...state.modal,__recipeDraft:rows,__draftImage:d.image,__category:d.category,__name:d.name,__price:d.price,__manualHpp:d.manualHpp,__useRecipe:state.modal?.__useRecipe};render();}

function exportCSV(){
 if(state.plan!=="PRO"){openPro();return;}
 if(!state.transactions.length){toast("Belum ada transaksi untuk diekspor.",true);return;}
 const rows=[["ID Transaksi","Waktu","Metode Bayar","Total Tagihan","Total HPP","Laba","Uang Diterima","Kembalian","Detail Item"]];
 for(const t of state.transactions){
  const items=(t.items||[]).map(i=>`${i.name} (${i.qty}x)`).join("; ");
  rows.push([t.id,new Date(t.date).toLocaleString("id-ID"),t.method,t.total,t.totalHpp,t.netProfit,t.cashReceived,t.change,items]);
 }
 const csv="\uFEFF"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download=`Laporan_POS_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 toast("Laporan CSV berhasil dibuat");
}

 return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(t.id)}</title><style>body{font-family:monospace;width:72mm;margin:0 auto;padding:12px;font-size:12px}h3{text-align:center;margin:0 0 8px}.meta{text-align:center;color:#555;font-size:10px}.line{border-top:1px dashed #888;margin:10px 0}.rline{display:flex;justify-content:space-between;gap:8px;margin:6px 0}.total{font-weight:bold;font-size:14px}.foot{text-align:center;margin-top:14px;font-size:10px}

</style></head><body><h3>${esc(state.store)}</h3><div class="meta">${esc(new Date(t.date).toLocaleString("id-ID"))}<br>${esc(t.id)}</div><div class="line"></div>${items}<div class="line"></div><div class="rline total"><span>Total</span><span>${formatIDR(t.total)}</span></div><div class="rline"><span>Bayar</span><span>${formatIDR(t.cashReceived)}</span></div><div class="rline"><span>Kembali</span><span>${formatIDR(t.change)}</span></div><div class="rline"><span>Metode</span><span>${esc(t.method)}</span></div><div class="foot">Terima kasih</div><scr${"ipt"}>window.onload=()=>setTimeout(()=>window.print(),120);<\/script></body></html>`;
}
function printReceipt(){

 const w=window.open("","_blank","width=420,height=720");
 if(!w){toast("Browser memblokir jendela cetak. Izinkan pop-up untuk mencetak.",true);return;}

async function shareReceipt(){
 const t=state.transactions.find(x=>x.id===state.modal?.id);if(!t)return;
 const text=[state.store,t.id,new Date(t.date).toLocaleString("id-ID"),...(t.items||[]).map(i=>`${i.name} x${i.qty} = ${formatIDR(i.price*i.qty)}`),`Total: ${formatIDR(t.total)}`,`Bayar: ${formatIDR(t.cashReceived)}`,`Kembali: ${formatIDR(t.change)}`,`Metode: ${t.method}`].join("\n");
 try{
  if(navigator.share){await navigator.share({title:t.id,text});return;}
  if(navigator.clipboard){await navigator.clipboard.writeText(text);toast("Detail struk disalin ke clipboard");return;}
  toast("Bagikan tidak tersedia di browser ini.",true);
 }catch(e){}
}

/* ---------- Event delegation ---------- */
document.addEventListener("click",(ev)=>{
 const el=ev.target.closest?.("[data-action]"); if(!el)return;
 const action=el.dataset.action;
 if(action==="login")return login();
 if(action==="logout")return logout();
 if(action==="nav")return nav(el.dataset.value);
 if(action==="category")return setCategory(el.dataset.value);
 if(action==="add-cart")return addCart(el.dataset.id);
 if(action==="open-cart")return openCart();
 if(action==="close-modal"||action==="close-overlay") { if(action==="close-overlay"&&ev.target!==el)return; return closeModal(); }
 if(action==="open-payment")return openPayment();

 if(action==="quick-cash")return setQuickCash(el.dataset.value);
 if(action==="cash-clear"){if(state.modal?.type==="payment"){state.modal.cash=0;const i=document.getElementById("cash-input");if(i){i.value="";i.focus();}updatePaymentLive();}return;}
 if(action==="checkout")return checkout();
 if(action==="cart-plus")return mutateCart(el.dataset.id,1);
 if(action==="cart-minus")return mutateCart(el.dataset.id,-1);
 if(action==="cart-remove")return removeCart(el.dataset.id);
 if(action==="open-pro")return openPro();
 if(action==="upgrade")return upgrade();
 if(action==="catalog-tab"){state.catalog=el.dataset.value;state.modal=null;persist();return render();}
 if(action==="preset"){if(el.dataset.value===state.type)return;state.modal={type:"confirm-preset",value:el.dataset.value};return render();}
 if(action==="confirm-preset"){const v=state.modal?.value;state.modal=null;return applyPreset(v);}
 if(action==="confirm-reset"){state.modal=null;return resetData();}
 if(action==="add-product")return openProduct();
 if(action==="add-ingredient")return openIngredient();
 if(action==="edit-product")return openProduct(el.dataset.id);
 if(action==="edit-ingredient")return openIngredient(el.dataset.id);
 if(action==="photo-product"){state.modal={type:"product",id:Number(el.dataset.id)};render();return handlePhoto();}
 if(action==="choose-photo")return handlePhoto();
 if(action==="save-product")return saveProduct();
 if(action==="save-ingredient")return saveIngredient();
 if(action==="product-category")return productCategory(el.dataset.value);
 if(action==="add-recipe")return addRecipeLine();
 if(action==="remove-recipe")return removeRecipe(el.dataset.index);
 if(action==="recalc-recipe"){const rows=readRecipeFromModal();state.modal={...state.modal,__recipeDraft:rows};return render();}
 if(action==="delete-product"){
  const p=state.products.find(x=>x.id===Number(el.dataset.id));if(!p)return;
  if(state.cart.some(x=>x.productId===p.id)){toast("Keluarkan produk dari keranjang sebelum menghapus.",true);return;}
  state.modal={type:"confirm-delete-product",id:p.id,name:p.name};return render();
 }
 if(action==="confirm-delete-product"){
  const id=state.modal.id;state.products=state.products.filter(x=>x.id!==id);persist();state.modal=null;render();return toast("Produk dihapus");
 }
 if(action==="delete-ingredient"){
  const i=state.ingredients.find(x=>x.id===Number(el.dataset.id));if(!i)return;
  state.modal={type:"confirm-delete-ingredient",id:i.id,name:i.name};return render();
 }
 if(action==="confirm-delete-ingredient"){

  state.products=state.products.map(p=>({...p,recipe:(p.recipe||[]).filter(r=>r.ingredientId!==id),stockItemId:Number(p.stockItemId)===id?undefined:p.stockItemId}));
  persist();state.modal=null;render();return toast("Bahan dihapus dan HPP resep diperbarui");

function render(){
 const root=document.getElementById("app");if(!root)return;
 if(!state.logged){root.innerHTML=renderLogin();return;}
 if(state.modal?.type==="product"){
  const d=currentDraftForRender();
  if(state.modal.__name===undefined)state.modal.__name=d.name;
  if(state.modal.__price===undefined)state.modal.__price=d.price;
  if(state.modal.__recipeDraft===undefined)state.modal.__recipeDraft=d.recipe.map(r=>({...r}));
  if(state.modal.__draftImage===undefined)state.modal.__draftImage=d.image;
  if(state.modal.__category===undefined)state.modal.__category=d.category;
  if(state.modal.__manualHpp===undefined)state.modal.__manualHpp=d.manualHpp||0;
  if(state.modal.__stockItemId===undefined)state.modal.__stockItemId=d.stockItemId||state.ingredients[0]?.id||0;
  if(state.modal.__stockUsageQty===undefined)state.modal.__stockUsageQty=d.stockUsageQty||0;
  if(state.modal.__useRecipe===undefined)state.modal.__useRecipe=d.recipe.length>0;
 }
 const body=state.tab==="pos"?renderPOS():state.tab==="history"?renderHistory():state.tab==="catalog"?renderCatalog():renderSettings();
 root.innerHTML=`<div class="phone">${body}${navHtml()}${renderModal()}</div>`;
 drawToast();
}

 toScaled,scaledToNumber,ingredientUnitCost,calculateRecipeHpp,calculateCartTotals,isTodayLocal,getQuickCashSuggestions,getState:()=>state,
 login,logout,nav,addCart,openPayment,checkout,closeModal,applyPreset,openProduct,openIngredient,saveProduct,saveIngredient,exportCSV
};

} catch (bootError) {

  /* V13 BUG-03: back up raw data before falling back; never delete. */
  try { const raw=localStorage.getItem(STORAGE_KEY); if(raw) localStorage.setItem(STORAGE_KEY+"-recovery-"+Date.now(), raw); } catch (_) {}
  state = seedFromPreset("coffee");
  try { render(); } catch (_) {
    const root = document.getElementById("app");
    if (root) root.innerHTML = renderLogin();

}
